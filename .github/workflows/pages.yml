name: Deploy public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Restore hero image
        run: |
          cat assets/hero/part-*.b64 | tr -d '\n' | base64 --decode > public/niigata-city-hero.webp
          test "$(head -c 4 public/niigata-city-hero.webp)" = "RIFF"
          test "$(dd if=public/niigata-city-hero.webp bs=1 skip=8 count=4 2>/dev/null)" = "WEBP"
      - name: Build Niigata edition
        run: npx next build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}/niigata
      - name: Assemble Life Atlas site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir -p site/niigata
          cp -a out/. site/niigata/
          touch site/.nojekyll
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="ja">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=${PAGES_BASE_PATH}/niigata/">
              <link rel="canonical" href="${PAGES_BASE_PATH}/niigata/">
              <title>LIFE ATLAS</title>
            </head>
            <body>
              <p><a href="${PAGES_BASE_PATH}/niigata/">新潟版へ移動します</a></p>
            </body>
          </html>
          EOF
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
